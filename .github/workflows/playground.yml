name: living readme

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 7 * * *" # nightly skyline refresh
  push:
    branches: [main, master]
    paths:
      - "generators/**"
      - "!generators/intro/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: living-readme
  cancel-in-progress: false

jobs:
  gesture:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'gesture:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generators/requirements.txt
      - run: pip install -r generators/requirements.txt
      - name: Play the gesture
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: python generators/playground.py --gesture "$TITLE" --user "$PLAYER" --result-file /tmp/result.md
      - name: Commit
        env:
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets docs generators/loop/state.json generators/ratelimit.json README.md
          git diff --cached --quiet || git commit -m "feature(loop): gesture from @${PLAYER}"
          git pull --rebase --autostash
          git push
      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"

  rebuild:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generators/requirements.txt
      - run: pip install -r generators/requirements.txt
      - name: Refresh skyline history and re-render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generators/playground.py --refresh-history --render-only
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets docs generators/skyline/history.json README.md
          git diff --cached --quiet || git commit -m "chore(readme): nightly rebuild"
          git push
